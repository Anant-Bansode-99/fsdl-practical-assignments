<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="icon" type="image/png" href="images/TaskFlow.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="bg-mesh"></div>

    <nav class="sidebar glass-panel">
        <div class="logo">
            <span>TaskFlow</span>
        </div>
        <ul class="nav-links">
            <li><a href="/index.html" class="active">Dashboard</a></li>
            <li><a href="/add-task.html">Add Task</a></li>
            <li><a href="/analytics.html">Analytics</a></li>
            <li style="margin-top: auto;"><a href="#" id="logoutBtn" style="color: var(--danger);">Logout</a></li>
        </ul>
    </nav>

    <main class="content">
        <header class="top-bar">
            <div>
                <h1>Good Morning! ☀️</h1>
                <p>Let's make today productive. <span id="pendingCountBadge" class="badge pending"
                        style="margin-left: 10px; display: none;">0 Pending</span></p>
            </div>
            <div class="user-profile" style="display:flex; align-items:center; gap:12px;">
                <div style="text-align:right;">
                    <div id="userNameDisplay" style="font-size:14px; font-weight:600; color:var(--text-main);"></div>
                    <div id="userEmailDisplay" style="font-size:12px; color:var(--text-muted);"></div>
                </div>
                <div class="avatar" id="userAvatar"
                    style="display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; color:white; cursor:default;">
                </div>
            </div>
        </header>

        <section class="dashboard-grid">
            <!-- Task List -->
            <div class="task-list-container">
                <div class="task-header">
                    <h2>Your Tasks</h2>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <div class="filter-group">
                            <button class="filter-btn active" data-filter="all">All</button>
                            <button class="filter-btn" data-filter="pending">Pending</button>
                            <button class="filter-btn" data-filter="completed">Completed</button>
                        </div>
                        <button id="clearCompletedBtn" class="filter-btn"
                            style="color: var(--danger); border: 1px solid var(--danger); display: none; align-items: center; gap: 6px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg> Clear Completed
                        </button>
                    </div>
                </div>
                <div id="tasksContainer" class="tasks-scroll-area">
                    <!-- Tasks injected by JS -->
                    <div class="loading-state">Loading tasks...</div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/dashboard.js"></script>
</body>

</html>
