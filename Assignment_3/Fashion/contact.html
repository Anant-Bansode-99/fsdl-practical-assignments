<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Luxe Lore</title>
  <link rel="icon" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="images/logo.png" alt="Logo" height="40" class="me-2" style="border-radius: 8px;">
        <span>Luxe Lore</span>
      </a>

      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
        data-bs-target="#navMenu">
        <i class="fa-solid fa-bars fs-4"></i>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item me-2">
            <a class="nav-link" href="login.html"><i class="fa-regular fa-user me-1"></i> Sign In</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5 pt-4 mb-5">
    <a href="javascript:history.back()" class="btn btn-link text-decoration-none text-muted mb-3 p-0"><i
        class="fa-solid fa-arrow-left me-2"></i>Back</a>
    <div class="row justify-content-center">
      <div class="col-lg-6 text-center mb-4">
        <h2 class="fw-bold fs-1 mb-2">Get in Touch</h2>
        <p class="text-muted">We're here to help and answer any question you might have.</p>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-6">
        <form class="glass p-5 rounded-4" onsubmit="event.preventDefault(); alert('Message Sent!');">
          <div class="mb-4">
            <label class="form-label text-secondary small fw-bold">Name</label>
            <input type="text" class="form-control bg-white" placeholder="John Doe" required>
          </div>
          <div class="mb-4">
            <label class="form-label text-secondary small fw-bold">Email</label>
            <input type="email" class="form-control bg-white" placeholder="john@example.com" required>
          </div>
          <div class="mb-4">
            <label class="form-label text-secondary small fw-bold">Message</label>
            <textarea class="form-control bg-white" rows="5" placeholder="How can we assist you today?"
              required></textarea>
          </div>
          <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Send Message</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container text-center">
      <a class="navbar-brand d-inline-flex align-items-center mb-3" href="index.html" style="color: white !important;">
        <img src="images/logo.png" alt="Logo" height="40" class="me-2" style="border-radius: 8px;">
        <span style="background: none; -webkit-text-fill-color: white; color: white;">Luxe Lore</span>
      </a>
      <p class="mb-4">Elevating everyday style with premium quality.</p>
      <div class="social-icons mb-4">
        <i class="fab fa-facebook-f"></i>
        <i class="fab fa-instagram"></i>
        <i class="fab fa-twitter"></i>
      </div>
      <p class="mb-0 small">© 2026 Luxe Lore. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
