<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Luxe Lore</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="images/logo.png" alt="Logo" height="40" class="me-2" style="border-radius: 8px;">
        <span>Luxe Lore</span>
      </a>

      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
        data-bs-target="#navMenu">
        <i class="fa-solid fa-bars fs-4"></i>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item me-2">
            <a class="nav-link" href="login.html"><i class="fa-regular fa-user me-1"></i> Sign In</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5 mb-5 pt-3">
    <a href="javascript:history.back()" class="btn btn-link text-decoration-none text-muted mb-3 p-0"><i
        class="fa-solid fa-arrow-left me-2"></i>Back</a>
    <h2 class="fw-bold fs-2 mb-4 text-center">Secure Checkout</h2>

    <div class="row justify-content-center g-4">
      <div class="col-lg-6">
        <div class="glass p-4 rounded-4">
          <h5 class="fw-bold mb-4"><i class="fa-solid fa-truck-fast me-2 text-muted"></i>Shipping Details</h5>
          <form id="checkoutForm">
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Full Name" required>
            </div>
            <div class="mb-3">
              <input type="tel" class="form-control" placeholder="Phone Number" required>
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Street Address" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <input type="text" class="form-control" placeholder="City" required>
              </div>
              <div class="col-md-6 mb-3">
                <input type="text" class="form-control" placeholder="Postal Code" required>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="glass p-4 rounded-4 sticky-top" style="top: 100px;">
          <h5 class="fw-bold mb-4"><i class="fa-solid fa-credit-card me-2 text-muted"></i>Payment Options</h5>
          <div class="mb-4">
            <select class="form-select form-select-lg">
              <option>Credit / Debit Card</option>
              <option>UPI / Net Banking</option>
              <option>Cash on Delivery</option>
            </select>
          </div>

          <button type="button" onclick="placeOrder()" class="btn btn-dark w-100 py-3 fw-bold fs-6 shadow">Complete
            Order</button>
          <div class="text-center mt-3 text-muted small">
            <i class="fa-solid fa-lock me-1"></i> Payments are 100% secure & encrypted
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script src="js/checkout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
