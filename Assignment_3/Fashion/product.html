<!DOCTYPE html>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="images/logo.png" alt="Logo" height="40" class="me-2" style="border-radius: 8px;">
        <span>Luxe Lore</span>
      </a>

      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"

      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center">

          <li class="nav-item">
            <a class="nav-link position-relative d-inline-block" href="cart.html">
              <i class="fa-solid fa-bag-shopping fs-5"></i>
              <span class="badge bg-danger position-absolute top-0 start-100 translate-middle" id="cartCount">0</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5 pt-3 mb-5">
    <a href="javascript:history.back()" class="btn btn-link text-decoration-none text-muted mb-3 p-0"><i

    <div id="productDetails">
      <!-- Dynamic content will be injected here via product.js -->

  <!-- Footer -->

    <div class="container text-center">
      <a class="navbar-brand d-inline-flex align-items-center mb-3" href="index.html" style="color: white !important;">
        <img src="images/logo.png" alt="Logo" height="40" class="me-2" style="border-radius: 8px;">
        <span style="background: none; -webkit-text-fill-color: white; color: white;">Luxe Lore</span>

      <div class="social-icons mb-4">

        <i class="fab fa-twitter"></i>
      </div>
      <p class="mb-0 small">© 2026 Luxe Lore. All Rights Reserved.</p>
    </div>

  <script src="js/products.js"></script>
