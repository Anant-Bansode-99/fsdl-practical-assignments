<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login | Luxe Lore</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="auth-wrapper">

    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="index.html" class="d-inline-flex align-items-center text-decoration-none">
          <img src="images/logo.png" alt="Logo" height="50" class="me-2 rounded">
        </a>
        <h3 class="mt-3">Welcome Back</h3>
        <p class="text-muted">Sign in to your Luxe Lore account to continue.</p>
      </div>

      <form onsubmit="loginUser(event);">

        <div class="mb-4 position-relative">
          <label class="form-label text-uppercase small fw-bold" style="color: #94A3B8; letter-spacing: 1px;">Email
            Address</label>
          <input type="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="mb-5 position-relative">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label text-uppercase small fw-bold m-0"
              style="color: #94A3B8; letter-spacing: 1px;">Password</label>
            <a href="#" class="text-decoration-none small" style="color: var(--accent-color);">Forgot?</a>
          </div>
          <input type="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-dark w-100">Sign In</button>
      </form>

      <div class="auth-links mt-4 text-center">
        <span class="text-secondary">New to Luxe Lore? <a href="#">Create account</a></span>
      </div>

      <div class="text-center mt-4 pt-4 border-top" style="border-color: rgba(255,255,255,0.1) !important;">
        <a href="index.html" class="btn btn-link text-decoration-none small" style="color: #94A3B8;"><i
            class="fa-solid fa-arrow-left me-2"></i> Return to Store</a>
      </div>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>

</html>
